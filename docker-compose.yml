services:
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tp3-network
    restart: unless-stopped

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    environment:
      - POSTGRES_DB=order_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tp3-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=my-ultra-secure-and-ultra-long-jwt-secret-key-tp3-microservices-2026-spring-boot
      - JWT_ACCESS_TOKEN_EXPIRATION_MS=900000
      - JWT_REFRESH_TOKEN_EXPIRATION_MS=86400000
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - tp3-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://order-db:5432/order_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_R2DBC_URL=r2dbc:postgresql://order-db:5432/order_db
      - SPRING_R2DBC_USERNAME=postgres
      - SPRING_R2DBC_PASSWORD=postgres
      - AUTH_SERVICE_URL=http://auth-service:8081
      - JWT_SECRET=my-ultra-secure-and-ultra-long-jwt-secret-key-tp3-microservices-2026-spring-boot
    depends_on:
      order-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - tp3-network
    restart: unless-stopped

volumes:
  auth-db-data:
  order-db-data:

networks:
  tp3-network:
    driver: bridge

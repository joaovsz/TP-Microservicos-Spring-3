services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - JWT_SECRET=my-ultra-secure-and-ultra-long-jwt-secret-key-tp3-microservices-2026-spring-boot
      - JWT_ACCESS_TOKEN_EXPIRATION_MS=900000
      - JWT_REFRESH_TOKEN_EXPIRATION_MS=86400000
    networks:
      - tp3-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - JWT_SECRET=my-ultra-secure-and-ultra-long-jwt-secret-key-tp3-microservices-2026-spring-boot
    depends_on:
      - auth-service
    networks:
      - tp3-network
    restart: unless-stopped

networks:
  tp3-network:
    driver: bridge

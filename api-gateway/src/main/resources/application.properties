server.port=8085
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Descoberta automatica de rotas pelo Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Rotas explicitas para conveniencia e compatibilidade direta
spring.cloud.gateway.routes[0].id=fornecedores-service
spring.cloud.gateway.routes[0].uri=lb://fornecedores-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/fornecedores/**

spring.cloud.gateway.routes[1].id=produtos-service
spring.cloud.gateway.routes[1].uri=lb://produtos-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/produtos/**

management.endpoints.web.exposure.include=health,info,gateway
